spring.application.name=tripGoAPI

# DB configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tripgo
spring.datasource.username=root
spring.datasource.password=Aa@123456

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Admin portal (Thymeleaf) configuration
# Uploads live on disk, outside the jar, and are served at /uploads/** by WebMvcConfig.
tripgo.upload.dir=${TRIPGO_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# JWT configuration
# JWT_SECRET has no default here on purpose: a shipped fallback would be a public, usable
# secret in every deployment that forgets to set it. Missing env var -> fail fast at startup.
tripgo.jwt.secret=${JWT_SECRET}
tripgo.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
tripgo.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:1209600}