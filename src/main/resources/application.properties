spring.application.name=tripGoAPI

# DB configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tripgo
spring.datasource.username=root
spring.datasource.password=Aa@123456

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT configuration
tripgo.jwt.secret=${JWT_SECRET:dev-only-secret-key-please-override-in-production-env-min-32-bytes}
tripgo.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
tripgo.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:1209600}